<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Platoboost VIP Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--primary:#6366f1;--secondary:#8b5cf6;--accent:#10b981;--error:#ef4444;--success:#22c55e;--warning:#f59e0b;--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--text-muted:#94a3b8;}
body{font-family:'Inter',sans-serif;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 50%,#020617 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden;}
.background-effects{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;opacity:0.6;}
.grid-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(99,102,241,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.03) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite;}
@keyframes gridMove{0%{transform:translate(0,0);}100%{transform:translate(50px,50px);}}
.floating-orbs{position:fixed;width:100%;height:100%;z-index:-1;pointer-events:none;}
.orb{position:absolute;border-radius:50%;background:linear-gradient(45deg,var(--primary),var(--secondary));filter:blur(40px);opacity:0.1;animation:float 8s ease-in-out infinite;}
.orb:nth-child(1){width:300px;height:300px;top:-150px;left:-150px;animation-delay:0s;}
.orb:nth-child(2){width:200px;height:200px;top:50%;right:-100px;animation-delay:-4s;}
.orb:nth-child(3){width:250px;height:250px;bottom:-125px;left:30%;animation-delay:-2s;}
.orb:nth-child(4){width:180px;height:180px;top:20%;left:10%;background:linear-gradient(45deg,var(--accent),var(--primary));animation-delay:-6s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}25%{transform:translate(30px,-30px) scale(1.1);}50%{transform:translate(-20px,20px) scale(0.9);}75%{transform:translate(25px,35px) scale(1.05);}}
.particles{position:fixed;width:100%;height:100%;z-index:-1;pointer-events:none;}
.particle{position:absolute;width:2px;height:2px;background:var(--primary);border-radius:50%;animation:particleFloat 15s linear infinite;opacity:0.6;}
@keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.container{width:100%;max-width:420px;background:rgba(30,41,59,0.8);backdrop-filter:blur(20px);border:1px solid rgba(51,65,85,0.8);border-radius:20px;padding:32px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.4),0 0 50px rgba(99,102,241,0.1),inset 0 1px 0 rgba(255,255,255,0.05);position:relative;z-index:1;}
.container::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(99,102,241,0.3) 0%,rgba(139,92,246,0.2) 25%,rgba(16,185,129,0.3) 50%,rgba(139,92,246,0.2) 75%,rgba(99,102,241,0.3) 100%);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;z-index:-1;}
.logo{text-align:center;font-size:28px;font-weight:600;background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:32px;animation:gradientShift 3s ease-in-out infinite;text-shadow:0 0 30px rgba(99,102,241,0.3);}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.btn{width:100%;padding:14px 18px;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.3s ease;margin-bottom:12px;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s ease;}
.btn:hover::before{left:100%;}
.btn-primary{background:linear-gradient(135deg,var(--primary),#4f46e5);color:white;box-shadow:0 4px 15px rgba(99,102,241,0.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.4);}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),#7c3aed);color:white;box-shadow:0 4px 15px rgba(139,92,246,0.3);}
.btn-secondary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(139,92,246,0.4);}
.btn-success{background:linear-gradient(135deg,var(--success),#16a34a);color:white;box-shadow:0 4px 15px rgba(34,197,94,0.3);}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(34,197,94,0.4);}
.input{width:100%;padding:14px 18px;border:1px solid var(--border);border-radius:12px;background:rgba(15,23,42,0.5);backdrop-filter:blur(10px);color:var(--text);font-size:14px;margin-bottom:12px;outline:none;transition:all 0.3s ease;}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.1),0 0 20px rgba(99,102,241,0.2);background:rgba(15,23,42,0.7);}
.status{text-align:center;padding:14px 18px;border-radius:12px;margin-bottom:16px;font-size:14px;font-weight:500;backdrop-filter:blur(10px);}
.status-success{background:rgba(34,197,94,0.1);color:var(--success);border:1px solid rgba(34,197,94,0.3);box-shadow:0 0 20px rgba(34,197,94,0.1);}
.status-error{background:rgba(239,68,68,0.1);color:var(--error);border:1px solid rgba(239,68,68,0.3);box-shadow:0 0 20px rgba(239,68,68,0.1);}
.status-warning{background:rgba(245,158,11,0.1);color:var(--warning);border:1px solid rgba(245,158,11,0.3);box-shadow:0 0 20px rgba(245,158,11,0.1);}
.link{display:block;text-align:center;color:var(--primary);text-decoration:none;padding:14px 18px;border:1px solid rgba(99,102,241,0.5);border-radius:12px;margin-bottom:12px;font-size:14px;font-weight:500;transition:all 0.3s ease;background:rgba(99,102,241,0.05);backdrop-filter:blur(10px);}
.link:hover{background:rgba(99,102,241,0.15);transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.2);}
.vip-list{display:none;margin-top:20px;}
.vip-item{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.3s ease;margin-bottom:10px;background:rgba(15,23,42,0.3);backdrop-filter:blur(10px);}
.vip-item:hover{background:rgba(99,102,241,0.1);border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 25px rgba(99,102,241,0.15);}
.vip-item img{width:52px;height:52px;border-radius:8px;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.vip-item span{color:var(--text);font-weight:500;font-size:14px;}
.countdown{text-align:center;color:var(--text-muted);font-size:13px;margin-top:8px;padding:8px 12px;background:rgba(148,163,184,0.1);border-radius:8px;backdrop-filter:blur(10px);}
.hidden{display:none;}
.loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top:2px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-right:8px;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.admin-btn{position:fixed;top:25px;right:25px;width:60px;height:60px;background:linear-gradient(135deg,var(--accent),#059669);border:none;border-radius:50%;color:white;font-size:24px;cursor:pointer;box-shadow:0 8px 25px rgba(16,185,129,0.3);transition:all 0.3s ease;z-index:1000;backdrop-filter:blur(10px);}
.admin-btn:hover{transform:scale(1.1) rotate(360deg);box-shadow:0 12px 30px rgba(16,185,129,0.4);}
.admin-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.admin-modal.active{display:flex;}
.admin-content{width:100%;max-width:600px;background:rgba(30,41,59,0.95);border:2px solid rgba(99,102,241,0.5);border-radius:20px;padding:30px;max-height:90vh;overflow-y:auto;}
.admin-content h2{color:var(--accent);margin-bottom:20px;text-align:center;}
.admin-vip-card{background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:15px;}
.admin-vip-card img{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px;}
.admin-vip-card h3{color:var(--primary);font-size:16px;margin-bottom:8px;}
.admin-vip-card p{font-size:12px;color:var(--text-muted);margin-bottom:5px;word-break:break-all;}
.admin-actions{display:flex;gap:10px;margin-top:10px;}
.btn-small{flex:1;padding:8px 12px;font-size:12px;margin-bottom:0;}
.close-modal{position:absolute;top:15px;right:15px;width:35px;height:35px;background:rgba(239,68,68,0.2);border:2px solid var(--error);border-radius:50%;color:var(--error);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s ease;}
.close-modal:hover{background:rgba(239,68,68,0.4);transform:rotate(90deg);}
.stats-counter{position:fixed;top:15px;left:15px;background:rgba(30,41,59,0.95);backdrop-filter:blur(20px);border:2px solid rgba(99,102,241,0.6);border-radius:10px;padding:8px 12px;z-index:1000;box-shadow:0 8px 20px rgba(0,0,0,0.4),0 0 20px rgba(99,102,241,0.2);animation:slideInLeft 0.5s ease;display:flex;align-items:center;gap:8px;}
.stats-icon{width:20px;height:20px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(99,102,241,0.4);position:relative;flex-shrink:0;}
.stats-icon::before{content:'';position:absolute;width:5px;height:5px;background:white;border-radius:50%;top:7px;left:7px;box-shadow:0 0 4px white;}
.stats-icon::after{content:'';position:absolute;width:10px;height:1.5px;background:white;border-radius:2px;top:11px;left:5px;}
.visit-count{color:var(--text);font-size:18px;font-weight:700;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;transition:all 0.3s ease;line-height:1;}
.visit-count.updating{transform:scale(1.1);filter:brightness(1.3);}
@keyframes slideInLeft{0%{opacity:0;transform:translateX(-30px);}100%{opacity:1;transform:translateX(0);}}
@media (max-width:768px){.admin-btn{width:50px;height:50px;font-size:20px;top:20px;right:20px;}.admin-content{padding:20px;}.stats-counter{top:10px;left:10px;padding:6px 10px;gap:6px;}.stats-icon{width:16px;height:16px;}.stats-icon::before{width:4px;height:4px;top:6px;left:6px;}.stats-icon::after{width:8px;top:9px;left:4px;}.visit-count{font-size:16px;}}
</style>
</head>
<body>
<div class="background-effects"><div class="grid-bg"></div></div>
<div class="floating-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="particles" id="particles"></div>
<div class="stats-counter">
<div class="stats-icon"></div>
<div class="visit-count" id="visitCount">0</div>
</div>
<button class="admin-btn" onclick="openAdminModal()" title="Acceso Admin">⚙️</button>
<div class="container">
<div class="logo">🚀 PLATOBOOST VIP</div>
<button id="generateBtn" onclick="generateLink()" class="btn btn-primary">🔗 Generar Enlace Boost</button>
<button id="newLinkBtn" onclick="generateNewLink()" class="btn btn-secondary hidden">✨ Generar Nuevo Enlace</button>
<a id="fallbackLink" href="#" target="_blank" class="link hidden">🔗 Abrir manualmente</a>
<div id="status" class="hidden"></div>
<div id="countdown" class="countdown hidden"></div>
<input type="text" id="keyInput" placeholder="🔑 Pega tu key aquí" class="input" />
<button onclick="verifyKey()" class="btn btn-success">✅ Verificar Key</button>
<div id="result" class="status hidden">Resultado: -</div>
<div id="vipList" class="vip-list"></div>
</div>
<div id="adminModal" class="admin-modal">
<div class="admin-content" style="position:relative;">
<button class="close-modal" onclick="closeAdminModal()">✕</button>
<h2>🔐 Panel de Administración</h2>
<div id="loginSection">
<input type="password" id="adminPassword" placeholder="🔑 Contraseña de Admin" class="input" />
<button onclick="loginAdmin()" class="btn btn-primary">Iniciar Sesión</button>
</div>
<div id="adminSection" class="hidden">
<h3 style="color:var(--accent);margin-bottom:15px;">➕ Agregar Nuevo VIP</h3>
<input type="text" id="newVipName" placeholder="Nombre del VIP" class="input" />
<input type="url" id="newVipImage" placeholder="URL de la imagen" class="input" />
<input type="url" id="newVipLink" placeholder="URL del servidor VIP" class="input" />
<button onclick="addVIP()" class="btn btn-success">Agregar VIP</button>
<hr style="border:1px solid var(--border);margin:25px 0;">
<h3 style="color:var(--accent);margin-bottom:15px;">📋 VIPs Actuales</h3>
<button onclick="loadVIPsAdmin()" class="btn btn-secondary">🔄 Recargar Lista</button>
<div id="adminVipList"></div>
<button onclick="logoutAdmin()" class="btn btn-primary" style="margin-top:20px;">🚪 Cerrar Sesión</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
